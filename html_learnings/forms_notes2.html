<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body style=" background-color: #414141; color: white;"> 
<h1>shrey's playground</h1>
<br>

<form action="https:// " method="get">
    <label for="name">First Name</label>
    <input type="text" value="hitesh" id="name"><br><br>
    <button type="reset">reset button</button>
    <input type="submit" value="submit input">
    <input type="reset" value="reset input"><br><br>

    <input type="week" name="" id="week">

    <!-- select is used if you want to put option bar -->
    <select name="editors" id="selection" >
        <option value="vscode">vscode</option>
        <option value="intellijidea">intellij idea</option>
        <option value="eclipse">eclipse editor</option>
    </select><br><br>

    <!-- an alternative for <select> tag is datalist... 
         no one uses it -->

         <label for="editors">which editor do you use</label>
     <input list="editors" name="editors1">
     <datalist id="editors">
        <option value="vscode">vscode</option>
        <option value="intellij">intellij</option>
        <option value="anaconda">anaconda</option>
        <option value="notepad">notepad</option>
     </datalist><br><br>

     <!-- checkbox -->

     <label for="check1">siddhasana</label>
     <input type="checkbox" id="check1" name="asanas">
     <label for="check2">padmasana</label>
     <input type="checkbox" id="check2" name="asanas">
     <label for="check3">swastikasana</label>
     <input type="checkbox" id="check3" name="asanas"><br><br>


       <!-- radio button -->
        <!-- note that options for same questions are identified by their name="" attribute-->
     <label for="radio1">siddhasana</label>
     <input type="radio" id="radio1" name="asanas">
     <label for="radio2">padmasana</label>
     <input type="radio" id="radio2" name="asanas">
     <label for="radio3">swastikasana</label>
     <input type="radio" id="radio3" name="asanas">


     <!-- NOTE: there are so many other input methods. see documentations to learn about them -->
</form>

</body>
</html>
